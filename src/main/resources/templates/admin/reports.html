<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<head><title>Detection Reports</title></head>
<body>
<th:block th:fragment="content">

<!-- Flash messages -->
<div th:if="${success}" class="hidden" id="flash-success" th:data-msg="${success}"></div>
<div th:if="${error}" class="hidden" id="flash-error" th:data-msg="${error}"></div>

<!-- ── Filters & Search Bar ── -->
<div class="glass-card p-4 mb-4 flex flex-wrap items-center gap-3">
  <form method="get" action="/admin/reports" class="flex flex-wrap items-center gap-3 flex-1">
    <!-- Search -->
    <div class="relative flex-1 min-w-[200px]">
      <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
      <input type="text" name="search" th:value="${search}" placeholder="Search by email, merchant, reason…"
             class="w-full bg-white/5 border border-white/10 text-white placeholder-gray-600 rounded-xl px-4 py-2 pl-9 text-sm"/>
    </div>
    <!-- Status filter -->
    <select name="status" class="bg-white/5 border border-white/10 text-gray-300 rounded-xl px-3 py-2 text-sm">
      <option value="">All Statuses</option>
      <option value="OPEN" th:selected="${status == 'OPEN'}">Open</option>
      <option value="CONFIRMED_FRAUD" th:selected="${status == 'CONFIRMED_FRAUD'}">Confirmed Fraud</option>
      <option value="FALSE_POSITIVE" th:selected="${status == 'FALSE_POSITIVE'}">False Positive</option>
    </select>
    <!-- Sort -->
    <select name="sort" class="bg-white/5 border border-white/10 text-gray-300 rounded-xl px-3 py-2 text-sm">
      <option value="createdAt" th:selected="${sort == 'createdAt'}">Sort: Date</option>
      <option value="amount" th:selected="${sort == 'amount'}">Sort: Amount</option>
      <option value="fraudScore" th:selected="${sort == 'fraudScore'}">Sort: Risk Score</option>
      <option value="status" th:selected="${sort == 'status'}">Sort: Status</option>
    </select>
    <select name="dir" class="bg-white/5 border border-white/10 text-gray-300 rounded-xl px-3 py-2 text-sm">
      <option value="desc" th:selected="${dir == 'desc'}">Descending</option>
      <option value="asc" th:selected="${dir == 'asc'}">Ascending</option>
    </select>
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-xl transition">
      Apply
    </button>
  </form>
  <!-- Export CSV -->
  <a th:href="'/admin/reports/export?format=csv' + (${status != null} ? '&status=' + ${status} : '')"
     class="flex items-center gap-2 text-sm border border-white/10 text-gray-300 hover:border-indigo-500/50 hover:text-indigo-400 px-4 py-2 rounded-xl transition">
    <i data-lucide="download" class="w-4 h-4"></i> Export CSV
  </a>
</div>

<!-- ── Charts Row ── -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
  <div class="glass-card p-5">
    <h3 class="text-sm font-semibold text-white mb-1">Fraud Trend</h3>
    <p class="text-xs text-gray-500 mb-3">Cases over last 6 months</p>
    <canvas id="trendChart" height="180" aria-label="Fraud trend area chart"></canvas>
  </div>
  <div class="glass-card p-5">
    <h3 class="text-sm font-semibold text-white mb-1">Status Distribution</h3>
    <p class="text-xs text-gray-500 mb-3">Case breakdown by status</p>
    <canvas id="donutChart" height="180" aria-label="Status donut chart"></canvas>
  </div>
</div>

<!-- ── Cases Table ── -->
<div class="glass-card p-5">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h3 class="text-sm font-semibold text-white">Fraud Cases</h3>
      <p class="text-xs text-gray-500">
        Showing <span th:text="${cases.size()}">0</span> of <span th:text="${totalItems}">0</span> cases
      </p>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm" role="table">
      <thead>
        <tr class="text-xs text-gray-500 border-b border-white/5">
          <th class="text-left pb-3 font-medium pr-4">ID</th>
          <th class="text-left pb-3 font-medium pr-4">User</th>
          <th class="text-left pb-3 font-medium pr-4">Amount</th>
          <th class="text-left pb-3 font-medium pr-4">Merchant</th>
          <th class="text-left pb-3 font-medium pr-4">Risk Score</th>
          <th class="text-left pb-3 font-medium pr-4">Status</th>
          <th class="text-left pb-3 font-medium pr-4">Date</th>
          <th class="pb-3 font-medium">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${cases}" class="data-row border-b border-white/5 last:border-0">
          <td class="py-3 pr-4 font-mono text-xs text-gray-400">#<span th:text="${c.caseId}"></span></td>
          <td class="py-3 pr-4 text-gray-300 text-xs truncate max-w-[140px]" th:text="${c.userEmail}"></td>
          <td class="py-3 pr-4 text-white font-semibold">₹<span th:text="${c.amount}"></span></td>
          <td class="py-3 pr-4 text-gray-300 text-xs truncate max-w-[120px]" th:text="${c.merchant}"></td>
          <td class="py-3 pr-4">
            <div class="flex items-center gap-2">
              <div class="w-14 h-1.5 bg-white/10 rounded-full overflow-hidden">
                <div class="h-full rounded-full"
                     th:style="'width:' + (${c.fraudScore != null ? c.fraudScore * 100 : 0}) + '%;background:' + (${c.fraudScore != null && c.fraudScore >= 0.7} ? '#ef4444' : (${c.fraudScore != null && c.fraudScore >= 0.4} ? '#f59e0b' : '#10b981'))"></div>
              </div>
              <span class="text-xs text-gray-400" th:text="${c.fraudScore != null ? #numbers.formatDecimal(c.fraudScore, 1, 3) : '—'}"></span>
            </div>
          </td>
          <td class="py-3 pr-4">
            <span th:text="${c.caseStatus}"
                  th:classappend="${c.caseStatus.name() == 'OPEN'} ? 'badge-open' : (${c.caseStatus.name() == 'CONFIRMED_FRAUD'} ? 'badge-confirmed' : 'badge-false-positive')"
                  class="text-xs px-2.5 py-1 rounded-full font-medium"></span>
          </td>
          <td class="py-3 pr-4 text-xs text-gray-500"
              th:text="${c.createdAt != null ? #temporals.format(c.createdAt, 'dd MMM yy') : '—'}"></td>
          <td class="py-3">
            <div class="flex items-center gap-2">
              <a th:href="'/admin/reports/detail?id=' + ${c.caseId}"
                 class="text-indigo-400 hover:text-indigo-300 text-xs transition" aria-label="View case details">View</a>
              <!-- Quick review dropdown -->
              <th:block th:if="${c.caseStatus.name() == 'OPEN'}">
                <form method="post" action="/admin/reports/review" class="inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="caseId" th:value="${c.caseId}"/>
                  <input type="hidden" name="status" value="CONFIRMED_FRAUD"/>
                  <button type="submit" class="text-red-400 hover:text-red-300 text-xs transition" aria-label="Confirm as fraud">✓Fraud</button>
                </form>
                <form method="post" action="/admin/reports/review" class="inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="caseId" th:value="${c.caseId}"/>
                  <input type="hidden" name="status" value="FALSE_POSITIVE"/>
                  <button type="submit" class="text-emerald-400 hover:text-emerald-300 text-xs transition" aria-label="Mark as false positive">✗FP</button>
                </form>
              </th:block>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(cases)}">
          <td colspan="8" class="py-10 text-center text-gray-500">
            <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
            <p class="text-sm">No cases match your filters</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div th:if="${totalPages > 1}" class="flex items-center justify-between mt-4 pt-4 border-t border-white/5">
    <p class="text-xs text-gray-500">
      Page <span th:text="${currentPage}">1</span> of <span th:text="${totalPages}">1</span>
    </p>
    <div class="flex items-center gap-2">
      <a th:href="@{/admin/reports(page=${currentPage - 1}, status=${status}, sort=${sort}, dir=${dir}, search=${search})}"
         th:class="${currentPage == 1} ? 'pointer-events-none opacity-30 text-gray-500 text-xs px-3 py-1.5 rounded-lg border border-white/10' : 'text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-white/10 hover:border-indigo-500/50 hover:text-indigo-400 transition'">
        ← Prev
      </a>
      <a th:href="@{/admin/reports(page=${currentPage + 1}, status=${status}, sort=${sort}, dir=${dir}, search=${search})}"
         th:class="${currentPage == totalPages} ? 'pointer-events-none opacity-30 text-gray-500 text-xs px-3 py-1.5 rounded-lg border border-white/10' : 'text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-white/10 hover:border-indigo-500/50 hover:text-indigo-400 transition'">
        Next →
      </a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  const s = document.getElementById('flash-success');
  const e = document.getElementById('flash-error');
  if (s) showToast(s.dataset.msg, 'success');
  if (e) showToast(e.dataset.msg, 'error');

  // Trend chart
  fetch('/api/charts/fraud-trend?months=6').then(r => r.json()).then(data => {
    const ctx = document.getElementById('trendChart').getContext('2d');
    const gradient = ctx.createLinearGradient(0,0,0,180);
    gradient.addColorStop(0,'rgba(99,102,241,0.4)');
    gradient.addColorStop(1,'rgba(99,102,241,0)');
    new Chart(ctx, { type: 'line', data: {
      labels: data.labels,
      datasets: [{ data: data.values, borderColor: '#6366f1', backgroundColor: gradient, tension: 0.4, fill: true, borderWidth: 2, pointRadius: 3 }]
    }, options: { responsive: true, plugins: { legend: { display: false } },
      scales: { x: { grid: { color:'rgba(255,255,255,0.05)' }, ticks: { color:'#6b7280', font:{size:10} } },
        y: { beginAtZero:true, grid: { color:'rgba(255,255,255,0.05)' }, ticks: { color:'#6b7280', font:{size:10} } } } } });
  });

  // Donut chart
  fetch('/api/charts/status-distribution').then(r => r.json()).then(data => {
    const ctx = document.getElementById('donutChart').getContext('2d');
    new Chart(ctx, { type: 'doughnut', data: {
      labels: data.labels,
      datasets: [{ data: data.values, backgroundColor: data.colors, borderColor: '#0f0f11', borderWidth: 3 }]
    }, options: { responsive: true, cutout: '60%',
      plugins: { legend: { position:'bottom', labels: { color:'#6b7280', font:{size:10}, padding:10 } } } } });
  });
});
</script>

</th:block>
</body>
</html>
