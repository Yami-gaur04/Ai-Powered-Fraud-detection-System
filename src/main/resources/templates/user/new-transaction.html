<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<head><title>New Transaction</title></head>
<body>
<th:block th:fragment="content">

<!-- Flash messages -->
<div th:if="${error}" class="flex items-center gap-3 bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-xl mb-5 text-sm">
  <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
  <span th:text="${error}"></span>
</div>

<div class="max-w-2xl mx-auto">
  <div class="glass-card p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-11 h-11 bg-indigo-500/15 rounded-xl flex items-center justify-center">
        <i data-lucide="send" class="w-6 h-6 text-indigo-400"></i>
      </div>
      <div>
        <h2 class="text-base font-semibold text-white">Submit New Transaction</h2>
        <p class="text-xs text-gray-500">All transactions are analysed for fraud in real-time</p>
      </div>
    </div>

    <form method="post" action="/user/transactions/new" id="tx-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <!-- Amount -->
        <div class="sm:col-span-2">
          <label for="amount" class="block text-xs font-medium text-gray-400 mb-1.5">
            Amount <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm font-medium">₹</span>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" required
                   placeholder="0.00"
                   class="w-full bg-white/5 border border-white/10 text-white placeholder-gray-600 rounded-xl px-4 py-3 pl-7 text-sm focus:border-indigo-500 transition text-lg font-semibold"
                   aria-label="Transaction amount"
                   oninput="updateRiskHint()"/>
          </div>
          <p id="amount-hint" class="text-xs text-gray-600 mt-1">Enter the transaction value in INR</p>
        </div>

        <!-- Merchant / Receiver -->
        <div>
          <label for="merchant" class="block text-xs font-medium text-gray-400 mb-1.5">
            Merchant / Receiver <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <i data-lucide="store" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input type="text" id="merchant" name="merchant" required
                   placeholder="e.g. Amazon, Flipkart"
                   class="w-full bg-white/5 border border-white/10 text-white placeholder-gray-600 rounded-xl px-4 py-2.5 pl-10 text-sm focus:border-indigo-500 transition"
                   aria-label="Merchant name"/>
          </div>
        </div>

        <!-- Transaction Type / Payment Method -->
        <div>
          <label for="paymentMethod" class="block text-xs font-medium text-gray-400 mb-1.5">Transaction Type</label>
          <div class="relative">
            <i data-lucide="layers" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <select id="paymentMethod" name="paymentMethod"
                    class="w-full bg-white/5 border border-white/10 text-gray-300 rounded-xl px-4 py-2.5 pl-10 text-sm focus:border-indigo-500 transition appearance-none">
              <option value="ONLINE">Online Transfer</option>
              <option value="UPI">UPI</option>
              <option value="CARD">Credit/Debit Card</option>
              <option value="NEFT">NEFT</option>
              <option value="RTGS">RTGS</option>
              <option value="CASH">Cash</option>
            </select>
          </div>
        </div>

        <!-- Location -->
        <div>
          <label for="location" class="block text-xs font-medium text-gray-400 mb-1.5">
            Location <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input type="text" id="location" name="location" required
                   placeholder="City, State or Country"
                   class="w-full bg-white/5 border border-white/10 text-white placeholder-gray-600 rounded-xl px-4 py-2.5 pl-10 text-sm focus:border-indigo-500 transition"
                   aria-label="Transaction location"/>
          </div>
        </div>

        <!-- Device ID -->
        <div>
          <label for="deviceId" class="block text-xs font-medium text-gray-400 mb-1.5">
            Device ID <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <i data-lucide="smartphone" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input type="text" id="deviceId" name="deviceId" required
                   placeholder="Browser, App or Device identifier"
                   class="w-full bg-white/5 border border-white/10 text-white placeholder-gray-600 rounded-xl px-4 py-2.5 pl-10 text-sm focus:border-indigo-500 transition"
                   aria-label="Device identifier"/>
          </div>
          <p class="text-xs text-gray-600 mt-1">New device may increase risk score</p>
        </div>
      </div>

      <!-- Risk preview bar -->
      <div class="mt-5 p-4 bg-white/3 rounded-xl">
        <div class="flex justify-between text-xs text-gray-400 mb-2">
          <span>Estimated risk (amount-based preview)</span>
          <span id="risk-pct">—</span>
        </div>
        <div class="h-2 bg-white/10 rounded-full overflow-hidden">
          <div id="risk-bar" class="h-full rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
        <p id="risk-label" class="text-xs text-gray-500 mt-1.5">Enter an amount to preview estimated risk</p>
      </div>

      <button type="submit" id="submit-btn"
              class="w-full mt-5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
        <i data-lucide="shield" class="w-5 h-5"></i>
        Analyse & Submit Transaction
      </button>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  // Auto-fill device ID from browser fingerprint
  document.getElementById('deviceId').placeholder = navigator.userAgent.slice(0,30) + '…';
});

function updateRiskHint() {
  const amount = parseFloat(document.getElementById('amount').value);
  const bar = document.getElementById('risk-bar');
  const pct = document.getElementById('risk-pct');
  const label = document.getElementById('risk-label');
  if (isNaN(amount) || amount <= 0) {
    bar.style.width = '0%'; pct.textContent = '—'; label.textContent = 'Enter an amount to preview estimated risk'; return;
  }
  // Simple client-side estimate: flagged at 50k, maxed at 100k
  const HIGH = 50000;
  const score = Math.min(1, amount / (HIGH * 2));
  const pctVal = Math.round(score * 100);
  bar.style.width = pctVal + '%';
  if (score >= 0.7) { bar.style.background = '#ef4444'; label.textContent = '⚠ High risk amount'; label.style.color = '#ef4444'; }
  else if (score >= 0.35) { bar.style.background = '#f59e0b'; label.textContent = '⚡ Medium risk amount'; label.style.color = '#f59e0b'; }
  else { bar.style.background = '#10b981'; label.textContent = '✓ Low risk amount'; label.style.color = '#10b981'; }
  pct.textContent = pctVal + '%';
}

document.getElementById('tx-form').addEventListener('submit', function() {
  const btn = document.getElementById('submit-btn');
  btn.innerHTML = '<svg class="animate-spin w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Analysing…';
  btn.disabled = true;
});
</script>

</th:block>
</body>
</html>
