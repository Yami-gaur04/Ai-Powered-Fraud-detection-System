<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — FraudShield</title>
  <meta name="description" content="Sign in to the AI-Powered Fraud Detection System"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { background: #0a0a0b; font-family: 'Inter', sans-serif; }
    .glow { box-shadow: 0 0 60px rgba(99,102,241,0.15); }
    input:focus { outline: none; box-shadow: 0 0 0 2px rgba(99,102,241,0.5); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Background grid -->
  <div class="fixed inset-0 bg-[linear-gradient(rgba(99,102,241,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(99,102,241,0.03)_1px,transparent_1px)] bg-[size:64px_64px]"></div>
  <div class="fixed inset-0 bg-gradient-radial from-indigo-600/5 via-transparent to-transparent" style="background: radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.12) 0%, transparent 70%)"></div>

  <div class="relative z-10 w-full max-w-md">
    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
        <i data-lucide="shield-check" class="w-7 h-7 text-white"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">FraudShield</h1>
        <p class="text-xs text-gray-500">AI-Powered Detection System</p>
      </div>
    </div>

    <!-- Card -->
    <div class="bg-[#0f0f11] border border-white/8 rounded-2xl p-8 glow">
      <h2 class="text-xl font-semibold text-white mb-1">Welcome back</h2>
      <p class="text-sm text-gray-400 mb-6">Sign in to your account to continue</p>

      <!-- Alert: error -->
      <div th:if="${error}" class="flex items-center gap-3 bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-xl mb-5 text-sm">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span th:text="${error}">Invalid credentials</span>
      </div>
      <!-- Alert: success / logout -->
      <div th:if="${logoutMsg}" class="flex items-center gap-3 bg-green-500/10 border border-green-500/20 text-green-400 px-4 py-3 rounded-xl mb-5 text-sm">
        <i data-lucide="check-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span th:text="${logoutMsg}">Logged out</span>
      </div>
      <div th:if="${success}" class="flex items-center gap-3 bg-green-500/10 border border-green-500/20 text-green-400 px-4 py-3 rounded-xl mb-5 text-sm">
        <i data-lucide="check-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span th:text="${success}">Success</span>
      </div>

      <form method="post" action="/login" class="space-y-4">
        <!-- CSRF token (Spring Security auto-injects via Thymeleaf) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
          <label for="username" class="block text-sm font-medium text-gray-300 mb-1.5">Email address</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input type="email" id="username" name="username" required autocomplete="email"
                   placeholder="you@example.com"
                   class="w-full bg-white/5 border border-white/10 text-white placeholder-gray-600 rounded-xl px-4 py-2.5 pl-10 text-sm transition-all"/>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   placeholder="••••••••"
                   class="w-full bg-white/5 border border-white/10 text-white placeholder-gray-600 rounded-xl px-4 py-2.5 pl-10 text-sm transition-all"/>
            <button type="button" onclick="togglePwd()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="login-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 text-sm mt-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Sign in
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-5">
        Don't have an account?
        <a href="/register" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Create one</a>
      </p>

      <!-- Demo credentials hint -->
      <div class="mt-5 p-3 bg-indigo-500/5 border border-indigo-500/15 rounded-xl text-xs text-gray-500 space-y-0.5">
        <p class="font-medium text-gray-400 mb-1">Demo credentials:</p>
        <p>Admin: <code class="text-indigo-400">admin@fraud.com</code> / <code class="text-indigo-400">Admin@123</code></p>
        <p>User: Register a new account below</p>
      </div>
    </div>
  </div>

<script>
  lucide.createIcons();
  function togglePwd() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }
  // Loading state on submit
  document.querySelector('form').addEventListener('submit', function() {
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in…';
    btn.disabled = true;
  });
</script>
</body>
</html>
