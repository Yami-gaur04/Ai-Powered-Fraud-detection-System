spring.application.name=fraud-detection-system
server.port=8080

# MySQL  (create the DB first:  CREATE DATABASE fraud_detection_db;)
spring.datasource.url=jdbc:mysql://localhost:3306/fraud_detection_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT (use a long random string, at least 32 characters)
app.jwt.secret=change-this-to-a-long-random-secret-key-min-32-chars
app.jwt.expiration-ms=86400000
