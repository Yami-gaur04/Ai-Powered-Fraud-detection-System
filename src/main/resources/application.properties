spring.application.name=fraud-detection-system
server.port=8080

# Database Configuration (Embedded persistent H2 database in MySQL mode - no password required)
spring.datasource.url=jdbc:h2:file:./data/frauddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional web console at /h2-console)
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT (use a long random string, at least 32 characters)
app.jwt.secret=change-this-to-a-long-random-secret-key-min-32-chars
app.jwt.expiration-ms=86400000

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
