spring.application.name=fraud-detection-system
server.port=8080

# H2 file-mode database (data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/frauddb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=FraudShieldSuperSecretKey2024VeryLongAndSecure!!
app.jwt.expiration-ms=86400000
